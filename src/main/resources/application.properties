spring.application.name=Ejercicio5MyAPIGestor
server.port=${PORT:${SERVER_PORT:8081}}
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3307/dbgestor}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.mariadb.jdbc.Driver}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

# Monitoreo y Observabilidad (Spring Boot Actuator + Prometheus)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
