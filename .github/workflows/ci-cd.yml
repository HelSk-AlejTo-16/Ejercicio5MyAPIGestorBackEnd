name: CI/CD Backend DevSecOps

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  ci-devsecops:
    name: Build, Tests, JaCoCo, SBOM, SonarCloud, Semgrep, Docker, Trivy & Azure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio (historial completo para SonarCloud)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configurar JDK 21 y cache Maven
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Compilar, Pruebas (Surefire), Cobertura (JaCoCo) y SBOM (CycloneDX)
        run: |
          for attempt in 1 2 3; do
            if mvn clean test jacoco:report cyclonedx:makeAggregateBom -B; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            echo "Reintentando Maven ($attempt/3) tras posible HTTP 429 en Maven Central..."
            sleep 15
          done

      - name: Publicar resumen de Pruebas, Cobertura y SBOM en GitHub Summary
        run: |
          python3 - << 'EOF'
          import glob, json, os, xml.etree.ElementTree as ET

          tests = failures = errors = skipped = 0
          for f in glob.glob("target/surefire-reports/TEST-*.xml"):
              root = ET.parse(f).getroot()
              tests += int(root.attrib.get("tests", 0))
              failures += int(root.attrib.get("failures", 0))
              errors += int(root.attrib.get("errors", 0))
              skipped += int(root.attrib.get("skipped", 0))

          cov = {}
          jacoco_xml = "target/site/jacoco/jacoco.xml"
          if os.path.exists(jacoco_xml):
              jroot = ET.parse(jacoco_xml).getroot()
              for c in jroot.findall("counter"):
                  m = int(c.attrib["missed"])
                  v = int(c.attrib["covered"])
                  pct = (v / (m + v) * 100.0) if (m + v) else 100.0
                  cov[c.attrib["type"]] = (v, m + v, pct)

          sbom_count = 0
          if os.path.exists("target/bom.json"):
              with open("target/bom.json", encoding="utf-8") as bf:
                  sbom_count = len(json.load(bf).get("components", []))

          inst = cov.get("INSTRUCTION", (0, 0, 0.0))
          br = cov.get("BRANCH", (0, 0, 0.0))

          summary = [
              "## Resultados DevSecOps Backend (`Ejercicio5MyAPIGestor`)",
              "| Metrica | Resultado |",
              "| :--- | :---: |",
              f"| **Pruebas Unitarias (Surefire)** | `{tests}` ejecutadas (`{failures}` fallos, `{errors}` errores, `{skipped}` omitidas) |",
              f"| **Cobertura Instrucciones (JaCoCo)** | **{inst[2]:.2f}%** (`{inst[0]}/{inst[1]}`) |",
              f"| **Cobertura Ramas (JaCoCo)** | **{br[2]:.2f}%** (`{br[0]}/{br[1]}`) |",
              f"| **Inventario SBOM (CycloneDX 1.5)** | `{sbom_count}` componentes catalogados (`bom.json`) |",
              ""
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("\n".join(summary) + "\n")
          EOF

      - name: Analisis de Calidad de Codigo (SonarCloud)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORG: ${{ vars.SONAR_ORGANIZATION || 'helsk-alejto-16' }}
          SONAR_KEY: ${{ vars.SONAR_PROJECT_KEY || 'HelSk-AlejTo-16_Ejercicio5MyAPIGestorBackEnd' }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            for attempt in 1 2 3; do
              if mvn sonar:sonar \
                -Dsonar.host.url=https://sonarcloud.io \
                -Dsonar.organization="$SONAR_ORG" \
                -Dsonar.projectKey="$SONAR_KEY" \
                -Dsonar.token="$SONAR_TOKEN" \
                -B; then break; fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              echo "Reintentando SonarCloud ($attempt/3) tras posible HTTP 429 en Maven Central..."
              sleep 15
            done
            echo "- **Calidad (SonarCloud):** Enviado exitosamente al proyecto \`$SONAR_KEY\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "SONAR_TOKEN no configurado aun; omitiendo envio a SonarCloud."
            echo "- **Calidad (SonarCloud):** Pendiente de configurar secret \`SONAR_TOKEN\` en el repositorio." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Escaneo de Seguridad SAST (Semgrep)
        run: |
          mkdir -p reportes
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/src" \
            -w /src \
            semgrep/semgrep \
            semgrep scan --config auto --timeout 30 \
              --exclude='target' \
              --exclude='reportes' \
              --exclude='*.sql' \
              --json --output reportes/semgrep-backend.json .

          python3 - << 'EOF'
          import json, os, sys
          with open("reportes/semgrep-backend.json", encoding="utf-8") as fh:
              data = json.load(fh)
          scanned = len(data.get("paths", {}).get("scanned", []))
          findings = data.get("results", [])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write(f"- **Seguridad SAST (Semgrep):** `{len(findings)}` hallazgos en `{scanned}` archivos escaneados.\n")
          if findings:
              for r in findings:
                  path = r.get("path", "")
                  line = r.get("start", {}).get("line", 1)
                  cid = r.get("check_id", "semgrep")
                  msg = r.get("extra", {}).get("message", "").replace("\n", " ")
                  print(f"::error file={path},line={line}::{cid}: {msg}")
              sys.exit(1)
          EOF

      - name: Verificar construccion de imagen Docker Multi-Stage
        run: docker build -t gestor-backend:ci .

      - name: Escaneo SCA de Dependencias (SBOM) e Imagen Contenedor (Trivy)
        run: |
          if command -v trivy >/dev/null 2>&1; then
            trivy sbom --exit-code 0 --quiet --format json --output reportes/trivy-sca.json target/bom.json
            trivy image --scanners vuln --exit-code 0 --quiet --format json --output reportes/trivy-image.json gestor-backend:ci
          else
            docker save gestor-backend:ci -o reportes/image.tar
            chmod 644 reportes/image.tar
            docker run --rm -v "${GITHUB_WORKSPACE}:/src" ghcr.io/aquasecurity/trivy:latest \
              sbom --exit-code 0 --quiet --format json --output /src/reportes/trivy-sca.json /src/target/bom.json
            docker run --rm -v "${GITHUB_WORKSPACE}/reportes:/reportes" ghcr.io/aquasecurity/trivy:latest \
              image --scanners vuln --exit-code 0 --quiet --input /reportes/image.tar --format json --output /reportes/trivy-image.json
            rm -f reportes/image.tar
          fi

          python3 - << 'EOF'
          import json, os
          def count_vulns(path):
              counts = {"CRITICAL": 0, "HIGH": 0, "MEDIUM": 0, "LOW": 0}
              if os.path.exists(path):
                  with open(path, encoding="utf-8") as fh:
                      data = json.load(fh) or {}
                  for res in (data.get("Results") or []):
                      for v in (res.get("Vulnerabilities") or []):
                          sev = v.get("Severity", "LOW")
                          if sev in counts:
                              counts[sev] += 1
              return counts

          sca = count_vulns("reportes/trivy-sca.json")
          img = count_vulns("reportes/trivy-image.json")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write(f"- **Seguridad SCA Dependencias (Trivy):** Critical `{sca['CRITICAL']}`, High `{sca['HIGH']}`, Medium `{sca['MEDIUM']}`, Low `{sca['LOW']}` (monitoreado por Dependabot).\n")
              out.write(f"- **Seguridad Imagen Docker (Trivy):** Critical `{img['CRITICAL']}`, High `{img['HIGH']}`, Medium `{img['MEDIUM']}`, Low `{img['LOW']}`.\n")
          EOF

      - name: Publicar Reportes Verificables (Surefire, JaCoCo, SBOM, Semgrep, Trivy)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reportes-ci-backend
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/bom.json
            reportes/semgrep-backend.json
            reportes/trivy-sca.json
            reportes/trivy-image.json
          retention-days: 30

      - name: Autenticar en Azure via OIDC (Zero-Secrets)
        if: github.event_name != 'pull_request' && vars.AZURE_CLIENT_ID != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Publicar imagen en Azure ACR y actualizar Container App
        if: github.event_name != 'pull_request' && vars.AZURE_CLIENT_ID != ''
        env:
          ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          RG_NAME: ${{ vars.AZURE_RG_NAME }}
          APP_NAME: ${{ vars.AZURE_CONTAINER_APP }}
        run: |
          az acr login --name "$ACR_NAME"
          TAG="${GITHUB_SHA::7}"
          docker tag gestor-backend:ci "${ACR_NAME}.azurecr.io/gestor-backend:${TAG}"
          docker tag gestor-backend:ci "${ACR_NAME}.azurecr.io/gestor-backend:v1"
          docker push "${ACR_NAME}.azurecr.io/gestor-backend:${TAG}"
          docker push "${ACR_NAME}.azurecr.io/gestor-backend:v1"
          if az containerapp show -n "$APP_NAME" -g "$RG_NAME" >/dev/null 2>&1; then
            az containerapp update -n "$APP_NAME" -g "$RG_NAME" --image "${ACR_NAME}.azurecr.io/gestor-backend:${TAG}"
            echo "- **Despliegue Azure:** Container App \`$APP_NAME\` actualizada a imagen \`${TAG}\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Despliegue Azure:** Imagen \`gestor-backend:v1\` publicada en ACR \`$ACR_NAME\` (lista para Terraform)." >> "$GITHUB_STEP_SUMMARY"
          fi
